abstract: 'We describe the experimental procedures for a dataset containing electroencephalographic (EEG) recordings of 38
  subjects playing in pairs to the multi-user version of a visual P300-based Brain-Computer Interface (BCI) named Brain Invaders.
  The interface uses the oddball paradigm on a grid of 36 symbols (1 Target, 35 Non-Target) that are flashed pseudo-randomly
  to elicit a P300 response. EEG data were recorded using 32 active wet electrodes per subject (total: 64 electrodes) during
  three randomised conditions (Solo1, Solo2, Collaboration). The experiment took place at GIPSA-lab, Grenoble, France, in
  2014.'
