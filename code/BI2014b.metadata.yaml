experiment:
  class_labels:
  - Target
  - NonTarget
  events:
    NonTarget: 1
    Target: 2
  feedback_type: visual
  instructions: destroy the target alien symbol as fast as possible. Up to eight attempts per level. If all attempts missed,
    level restarted.
  mode: online
  n_classes: 2
  paradigm: p300
  primary_modality: visual
  stimulus_modalities:
  - visual
  stimulus_presentation:
    animation: aliens slowly and regularly moved according to predefined path with constant inter-distance
    flash_groups: 6 rows and 6 columns (pseudo-random groups, not physical arrangement)
    repetition_structure: 12 flashes per repetition of pseudo-random groups of 6 symbols, such that each symbol flashes exactly
      twice per repetition
    target_ratio: 1:5 (Target vs Non-Target)
  stimulus_type: visual flashes
  study_design: multi-user/hyperscanning experiment with three randomized conditions (Solo1, Solo2, Collaboration). Subjects
    played in pairs. Solo conditions used a control design where non-playing participant focused on unanimated cross to prevent
    stimulus observation while EEG was recorded (to correct for fake inter-brain synchrony).
  study_domain: inter-brain synchrony in collaborative BCI
  synchronicity: synchronous
  task_type: oddball
file_format: mat and csv
methodology: 'Multi-user hyperscanning P300 BCI experiment designed to study inter-brain synchrony. Participants played Brain
  Invaders 2 in three conditions: Solo1 (player1 plays, player2 watches cross), Solo2 (roles reversed), and Collaboration
  (4 game sessions with both players). Each game session consisted of 9 levels with predefined alien configurations. A repetition
  used 12 flashes of pseudo-random groups of 6 symbols, ensuring each symbol flashed twice per repetition (1:5 Target:Non-Target
  ratio). Real-time adaptive RMDM classifier provided online feedback. Control condition (non-playing participant) allowed
  correction for fake inter-brain synchrony.'
